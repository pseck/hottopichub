name: Update trending content & publish

on:
  schedule:
    - cron: "17 */6 * * *"     # every 6 hours (UTC). Change to taste.
  workflow_dispatch:            # "Run workflow" button in the Actions tab
  push:
    branches: [main]            # re-render when you edit config/templates

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: trendsite
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate content and site
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            python -m generator.build --render-only
          else
            python -m generator.build
          fi

      - name: Save new posts back to the repo
        if: github.event_name != 'push'
        run: |
          git config user.name "trendsite-bot"
          git config user.email "trendsite-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Auto: trending content update [skip ci]"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
